# Publica la app en GitHub Pages en cada push.
#
# Requisito único, y se hace una sola vez a mano:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# La app se compila con base relativa (`base: './'` en vite.config.ts) y usa
# HashRouter, así que funciona igual en la raíz del dominio o en un subdirectorio
# como /web-app-inmo/, y no necesita configuración de rewrites en el servidor.
name: Publicar en GitHub Pages

on:
  push:
    branches:
      - main
      - claude/real-estate-accounting-app-581e8v
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Para ver si quedó algún despliegue colgado y cancelarlo.
  deployments: read

# Un despliegue por vez; si llega uno nuevo, se deja terminar el que está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # La verificación de humo usa Playwright, pero compilar no necesita navegadores.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Las claves de Supabase salen de .env.production: con ese archivo,
      # lo publicado pide login y guarda en el servidor; sin él, es la demo.
      - name: Compilar
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      # A veces un despliegue anterior queda colgado «en curso» del lado de
      # GitHub Pages y rechaza todos los que vienen después. Se cancela lo que
      # haya quedado pendiente antes de publicar; si no hay nada, no hace nada.
      - name: Destrabar despliegues anteriores colgados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=20" --jq '.[].sha' | sort -u); do
            [ "$sha" = "${{ github.sha }}" ] && continue
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1 \
              && echo "Cancelado el despliegue colgado de $sha" || true
          done

      - id: despliegue
        uses: actions/deploy-pages@v4
