# Trae el IPC de Córdoba del portal de datos abiertos y lo publica en el repo.
#
# La app es un sitio estático: el navegador no puede pedirle los datos al
# organismo (CORS, y el sitio puede estar caído). Entonces el que consulta es
# Actions, una vez por día: si hay un valor nuevo lo escribe en
# public/indices.json, lo commitea, y el push dispara el deploy.
#
# Hoy el organismo no contesta desde acá: el runner sale por un datacenter en
# Estados Unidos y sus sitios responden 404, 403 o con el origen caído. En ese
# caso el script avisa y termina bien, porque no hay nada que arreglar de este
# lado. Si en cambio la fuente contesta con datos y no se los puede interpretar,
# falla y deja la corrida en rojo: mejor enterarse que publicar un índice mal
# leído. El detalle de cada corrida queda en el resumen del job.
name: Actualizar índices

on:
  schedule:
    # Todos los días a las 12:00 UTC (9 de la mañana en Argentina).
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indices
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Consultar el organismo
        run: node scripts/actualizar-indices.mjs

      - name: Publicar si cambió algo
        run: |
          if [ -z "$(git status --porcelain public/indices.json)" ]; then
            echo "Sin cambios que commitear."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/indices.json
          git commit -m "Actualizar serie del IPC de Córdoba"
          git push
