# Temporal: averigua qué endpoints contesta el portal del organismo.
# Se borra apenas se sepa cuál es el bueno.
name: Sondeo del portal

on:
  workflow_dispatch:

jobs:
  sondear:
    runs-on: ubuntu-latest
    steps:
      - name: Probar rutas
        run: |
          node -e '
          const UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36";
          const urls = [
            "https://datosestadistica.cba.gov.ar/",
            "https://datosestadistica.cba.gov.ar/api/3/action/package_search?q=ipc&rows=5",
            "https://datosestadistica.cba.gov.ar/dataset/?q=ipc",
            "https://estadistica.cba.gov.ar/",
            "https://www.estadisticacordoba.gob.ar/",
          ];
          for (const u of urls) {
            for (const conUA of [true, false]) {
              try {
                const res = await fetch(u, { redirect: "manual", headers: conUA ? { "user-agent": UA, accept: "*/*" } : {} });
                const t = (await res.text()).replace(/\s+/g, " ").slice(0, 150);
                console.log(`::notice::[UA=${conUA}] ${res.status} ${u} -> ${res.headers.get("location") ?? res.headers.get("content-type")} :: ${t}`);
              } catch (e) {
                console.log(`::notice::[UA=${conUA}] ERR ${u} -> ${e.cause?.message ?? e.message}`);
              }
            }
          }
          ' --input-type=module
