name: Sondeo del portal

on:
  workflow_dispatch:

jobs:
  sondear:
    runs-on: ubuntu-latest
    steps:
      - name: Probar URLs que sí existen según el buscador
        run: |
          node -e '
          const UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36";
          const nota = (t) => console.log("::notice::" + String(t).replace(/\r?\n/g, "%0A").slice(0, 3000));
          const urls = [
            "https://datosestadistica.cba.gov.ar/dataset/indic",
            "https://datosestadistica.cba.gov.ar/dataset/indic/resource/2b4a7c60-1c8a-45b1-be8f-2bd59bfe2364",
            "https://datosestadistica.cba.gov.ar/api/3/action/package_show?id=indic",
            "https://estadistica.cba.gov.ar/wp-json/wp/v2/posts?search=precios&per_page=3",
          ];
          for (const u of urls) {
            try {
              const res = await fetch(u, { headers: { "user-agent": UA, accept: "*/*", "accept-language": "es-AR,es;q=0.9" } });
              const h = [...res.headers].map(([k, v]) => `${k}: ${v}`).join("%0A");
              const t = (await res.text()).replace(/\s+/g, " ").slice(0, 400);
              nota(`${res.status} ${u}%0A${h}%0A--%0A${t}`);
            } catch (e) { nota(`ERR ${u} -> ${e.cause?.message ?? e.message}`); }
          }
          ' --input-type=module

      - name: Qué ve la IP del runner
        run: curl -s https://ipinfo.io/json | tr -d "\n" | sed "s/^/::notice::/"
