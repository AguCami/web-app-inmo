name: Sondeo del portal

on:
  workflow_dispatch:

jobs:
  sondear:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar el IPC en el portal ArcGIS
        run: |
          node -e '
          const UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36";
          const nota = (t) => console.log("::notice::" + String(t).replace(/\r?\n/g, "%0A").slice(0, 4000));
          const traer = async (u) => {
            const r = await fetch(u, { headers: { "user-agent": UA, accept: "*/*" } });
            return { s: r.status, t: await r.text() };
          };
          const B = "https://estadistica.cba.gov.ar/portal/sharing/rest";

          for (const q of ["IPC", "precios al consumidor"]) {
            const u = `${B}/search?q=${encodeURIComponent(q)}&num=20&f=json`;
            try {
              const r = await traer(u);
              const j = JSON.parse(r.t);
              const filas = (j.results ?? []).map((x) => `${x.type} | ${x.title} | ${x.id} | ${x.url ?? ""}`);
              nota(`BUSCAR "${q}" total=${j.total}:%0A` + filas.join("%0A"));
            } catch (e) { nota(`BUSCAR "${q}" ERR ${e.message}`); }
          }

          for (const u of [`${B}/portals/self?f=json`, "https://estadistica.cba.gov.ar/server/rest/services?f=json"]) {
            try { const r = await traer(u); nota(`${u} -> ${r.s}%0A${r.t.slice(0, 900)}`); }
            catch (e) { nota(`${u} ERR ${e.message}`); }
          }
          ' --input-type=module
