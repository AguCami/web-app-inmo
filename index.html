<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b57b5" />
    <meta
      name="description"
      content="Gestión de alquileres: contratos, actualizaciones por índice, cobranzas y liquidaciones a propietarios."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
    />
    <title>M &amp; M · Alquileres</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      La lente del vidrio líquido.

      feDisplacementMap corre cada píxel del fondo según un mapa: el canal
      rojo lo mueve en horizontal y el verde en vertical. El mapa es un par
      de degradés que en el centro valen 128 —no mover— y en los bordes 0 o
      255 —empujar hacia afuera—. Eso es la refracción: lo que se ve detrás
      del vidrio no coincide con lo que lo rodea.

      El mapa se estira (preserveAspectRatio="none"), así un solo filtro
      sirve para un botón chico y para un diálogo grande.

      Solo anda en Chromium: Safari y Firefox no resuelven filtros SVG en
      backdrop-filter y descartan la regla, con lo que queda el desenfoque
      de la regla anterior. Es degradación, no rotura.
    -->
    <svg
      aria-hidden="true"
      width="0"
      height="0"
      style="position: absolute"
      focusable="false"
    >
      <filter
        id="lente"
        x="-25%"
        y="-25%"
        width="150%"
        height="150%"
        color-interpolation-filters="sRGB"
      >
        <feImage
          result="m"
          preserveAspectRatio="none"
          href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200' preserveAspectRatio='none'><defs><linearGradient id='x' x1='0' x2='1'><stop offset='0' stop-color='rgb(0,128,0)'/><stop offset='0.22' stop-color='rgb(128,128,0)'/><stop offset='0.78' stop-color='rgb(128,128,0)'/><stop offset='1' stop-color='rgb(255,128,0)'/></linearGradient><linearGradient id='y' y1='0' y2='1'><stop offset='0' stop-color='rgb(0,0,0)'/><stop offset='0.22' stop-color='rgb(0,128,0)'/><stop offset='0.78' stop-color='rgb(0,128,0)'/><stop offset='1' stop-color='rgb(0,255,0)'/></linearGradient></defs><rect width='200' height='200' fill='url(%23x)'/><rect width='200' height='200' fill='url(%23y)' style='mix-blend-mode:screen'/></svg>"
        />
        <feDisplacementMap
          in="SourceGraphic"
          in2="m"
          scale="72"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
      <filter
        id="lente-chica"
        x="-25%"
        y="-25%"
        width="150%"
        height="150%"
        color-interpolation-filters="sRGB"
      >
        <feImage
          result="m"
          preserveAspectRatio="none"
          href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200' preserveAspectRatio='none'><defs><linearGradient id='x' x1='0' x2='1'><stop offset='0' stop-color='rgb(0,128,0)'/><stop offset='0.22' stop-color='rgb(128,128,0)'/><stop offset='0.78' stop-color='rgb(128,128,0)'/><stop offset='1' stop-color='rgb(255,128,0)'/></linearGradient><linearGradient id='y' y1='0' y2='1'><stop offset='0' stop-color='rgb(0,0,0)'/><stop offset='0.22' stop-color='rgb(0,128,0)'/><stop offset='0.78' stop-color='rgb(0,128,0)'/><stop offset='1' stop-color='rgb(0,255,0)'/></linearGradient></defs><rect width='200' height='200' fill='url(%23x)'/><rect width='200' height='200' fill='url(%23y)' style='mix-blend-mode:screen'/></svg>"
        />
        <feDisplacementMap
          in="SourceGraphic"
          in2="m"
          scale="34"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
