<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b57b5" />
    <meta
      name="description"
      content="Gestión de alquileres: contratos, actualizaciones por índice, cobranzas y liquidaciones a propietarios."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
    />
    <title>M &amp; M · Alquileres</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      La lente del vidrio líquido.

      feDisplacementMap corre cada píxel del fondo según un mapa: el canal
      rojo lo mueve en horizontal y el verde en vertical. El mapa es un par
      de degradés que en el centro valen 128 —no mover— y en los bordes 0 o
      255 —empujar hacia afuera—. Eso es la refracción: lo que se ve detrás
      del vidrio no coincide con lo que lo rodea.

      El mapa se estira (preserveAspectRatio="none"), así un solo filtro
      sirve para un botón chico y para un diálogo grande.

      Solo anda en Chromium: Safari y Firefox no resuelven filtros SVG en
      backdrop-filter y descartan la regla, con lo que queda el desenfoque
      de la regla anterior. Es degradación, no rotura.
    -->
    <svg
      aria-hidden="true"
      width="0"
      height="0"
      style="position: absolute"
      focusable="false"
    >
      <filter
        id="lente"
        x="-25%"
        y="-25%"
        width="150%"
        height="150%"
        color-interpolation-filters="sRGB"
      >
        <feImage
          result="m"
          preserveAspectRatio="none"
          href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200' preserveAspectRatio='none'><defs><linearGradient id='x' x1='0' x2='1'><stop offset='0' stop-color='rgb(0,0,0)'/><stop offset='0.16667' stop-color='rgb(0,0,0)'/><stop offset='0.18190' stop-color='rgb(7,0,0)'/><stop offset='0.19714' stop-color='rgb(25,0,0)'/><stop offset='0.21238' stop-color='rgb(50,0,0)'/><stop offset='0.22762' stop-color='rgb(78,0,0)'/><stop offset='0.24286' stop-color='rgb(103,0,0)'/><stop offset='0.25810' stop-color='rgb(121,0,0)'/><stop offset='0.27333' stop-color='rgb(128,0,0)'/><stop offset='0.72667' stop-color='rgb(128,0,0)'/><stop offset='0.72667' stop-color='rgb(128,0,0)'/><stop offset='0.74190' stop-color='rgb(135,0,0)'/><stop offset='0.75714' stop-color='rgb(153,0,0)'/><stop offset='0.77238' stop-color='rgb(178,0,0)'/><stop offset='0.78762' stop-color='rgb(205,0,0)'/><stop offset='0.80286' stop-color='rgb(230,0,0)'/><stop offset='0.81810' stop-color='rgb(248,0,0)'/><stop offset='0.83333' stop-color='rgb(255,0,0)'/><stop offset='1' stop-color='rgb(255,0,0)'/></linearGradient><linearGradient id='y' y1='0' y2='1'><stop offset='0' stop-color='rgb(0,0,0)'/><stop offset='0.16667' stop-color='rgb(0,0,0)'/><stop offset='0.18190' stop-color='rgb(0,7,0)'/><stop offset='0.19714' stop-color='rgb(0,25,0)'/><stop offset='0.21238' stop-color='rgb(0,50,0)'/><stop offset='0.22762' stop-color='rgb(0,78,0)'/><stop offset='0.24286' stop-color='rgb(0,103,0)'/><stop offset='0.25810' stop-color='rgb(0,121,0)'/><stop offset='0.27333' stop-color='rgb(0,128,0)'/><stop offset='0.72667' stop-color='rgb(0,128,0)'/><stop offset='0.72667' stop-color='rgb(0,128,0)'/><stop offset='0.74190' stop-color='rgb(0,135,0)'/><stop offset='0.75714' stop-color='rgb(0,153,0)'/><stop offset='0.77238' stop-color='rgb(0,178,0)'/><stop offset='0.78762' stop-color='rgb(0,205,0)'/><stop offset='0.80286' stop-color='rgb(0,230,0)'/><stop offset='0.81810' stop-color='rgb(0,248,0)'/><stop offset='0.83333' stop-color='rgb(0,255,0)'/><stop offset='1' stop-color='rgb(0,255,0)'/></linearGradient></defs><rect width='200' height='200' fill='url(%23x)'/><rect width='200' height='200' fill='url(%23y)' style='mix-blend-mode:screen'/></svg>"
        />
        <feDisplacementMap
          in="SourceGraphic"
          in2="m"
          scale="72"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
      <filter
        id="lente-chica"
        x="-30%"
        y="-30%"
        width="160%"
        height="160%"
        color-interpolation-filters="sRGB"
      >
        <feImage
          result="m"
          preserveAspectRatio="none"
          href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200' preserveAspectRatio='none'><defs><linearGradient id='x' x1='0' x2='1'><stop offset='0' stop-color='rgb(0,0,0)'/><stop offset='0.18750' stop-color='rgb(0,0,0)'/><stop offset='0.21071' stop-color='rgb(7,0,0)'/><stop offset='0.23393' stop-color='rgb(25,0,0)'/><stop offset='0.25714' stop-color='rgb(50,0,0)'/><stop offset='0.28036' stop-color='rgb(78,0,0)'/><stop offset='0.30357' stop-color='rgb(103,0,0)'/><stop offset='0.32679' stop-color='rgb(121,0,0)'/><stop offset='0.35000' stop-color='rgb(128,0,0)'/><stop offset='0.65000' stop-color='rgb(128,0,0)'/><stop offset='0.65000' stop-color='rgb(128,0,0)'/><stop offset='0.67321' stop-color='rgb(135,0,0)'/><stop offset='0.69643' stop-color='rgb(153,0,0)'/><stop offset='0.71964' stop-color='rgb(178,0,0)'/><stop offset='0.74286' stop-color='rgb(205,0,0)'/><stop offset='0.76607' stop-color='rgb(230,0,0)'/><stop offset='0.78929' stop-color='rgb(248,0,0)'/><stop offset='0.81250' stop-color='rgb(255,0,0)'/><stop offset='1' stop-color='rgb(255,0,0)'/></linearGradient><linearGradient id='y' y1='0' y2='1'><stop offset='0' stop-color='rgb(0,0,0)'/><stop offset='0.18750' stop-color='rgb(0,0,0)'/><stop offset='0.21071' stop-color='rgb(0,7,0)'/><stop offset='0.23393' stop-color='rgb(0,25,0)'/><stop offset='0.25714' stop-color='rgb(0,50,0)'/><stop offset='0.28036' stop-color='rgb(0,78,0)'/><stop offset='0.30357' stop-color='rgb(0,103,0)'/><stop offset='0.32679' stop-color='rgb(0,121,0)'/><stop offset='0.35000' stop-color='rgb(0,128,0)'/><stop offset='0.65000' stop-color='rgb(0,128,0)'/><stop offset='0.65000' stop-color='rgb(0,128,0)'/><stop offset='0.67321' stop-color='rgb(0,135,0)'/><stop offset='0.69643' stop-color='rgb(0,153,0)'/><stop offset='0.71964' stop-color='rgb(0,178,0)'/><stop offset='0.74286' stop-color='rgb(0,205,0)'/><stop offset='0.76607' stop-color='rgb(0,230,0)'/><stop offset='0.78929' stop-color='rgb(0,248,0)'/><stop offset='0.81250' stop-color='rgb(0,255,0)'/><stop offset='1' stop-color='rgb(0,255,0)'/></linearGradient></defs><rect width='200' height='200' fill='url(%23x)'/><rect width='200' height='200' fill='url(%23y)' style='mix-blend-mode:screen'/></svg>"
        />
        <feDisplacementMap
          in="SourceGraphic"
          in2="m"
          scale="34"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
